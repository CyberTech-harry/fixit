name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Temporarily remove API routes (not supported on static hosting)
        run: |
          if [ -d "app/api" ]; then
            mv app/api app/_api_backup
            echo "✓ app/api moved to app/_api_backup"
          fi

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Restore API routes
        if: always()
        run: |
          if [ -d "app/_api_backup" ]; then
            mv app/_api_backup app/api
            echo "✓ app/api restored"
          fi

      - name: Copy public assets into out/
        run: |
          cp -r public/. out/
          echo "✓ public/ assets merged into out/"

      - name: Add CNAME for custom domain
        run: |
          echo "fixit.cybertechcomps.com" > out/CNAME
          echo "✓ CNAME file written"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
